<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conjugation Kombat</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-gold: #fbbf24;
            --neon-red: #ef4444;
            --neon-blue: #3b82f6;
            --neon-green: #22c55e;
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            margin: 0 0 20px;
            background: linear-gradient(to right, var(--neon-gold), #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            letter-spacing: 2px;
            text-align: center;
            font-size: 1.8rem;
        }

        .game-area {
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        /* COMBAT UI */
        .bars {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .health-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .bar-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .bar-track {
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .player-bar {
            background: var(--neon-gold);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .enemy-bar {
            background: var(--neon-red);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 120px;
            margin-bottom: 20px;
            padding: 0 20px;
            position: relative;
        }

        .avatar {
            font-size: 4rem;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
            transition: transform 0.2s;
        }

        .avatar.hit {
            animation: shake 0.4s;
            filter: grayscale(1) sepia(1) saturate(5) hue-rotate(-50deg);
        }

        .avatar.attack {
            animation: lunge 0.3s;
        }

        /* QUESTION CARD */
        .card {
            background: var(--card-dark);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
            position: relative;
        }

        .q-label {
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            opacity: 0.7;
        }

        .q-text {
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1.4;
        }

        /* START SCREEN */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .mode-btn {
            background: var(--card-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 20px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            border-color: var(--neon-gold);
            transform: translateY(-2px);
        }

        .mode-btn span {
            font-size: 1.5rem;
        }

        .highlight {
            color: var(--neon-blue);
        }

        .c-der {
            color: var(--neon-blue);
        }

        .c-die {
            color: var(--neon-red);
        }

        .c-das {
            color: var(--neon-green);
        }

        .c-pl {
            color: #94a3b8;
        }

        .missing {
            border-bottom: 3px solid var(--neon-gold);
            padding: 0 10px;
            display: inline-block;
            min-width: 60px;
            color: var(--neon-gold);
        }

        /* CONTROLS */
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .btn-opt {
            flex: 0 0 calc(50% - 8px);
            /* 2 columns for 4 options */
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-opt:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.05);
        }

        /* 3-option layout: single row, smaller buttons */
        .options-grid.three-opts .btn-opt {
            flex: 0 0 auto;
            padding: 15px 25px;
            font-size: 1rem;
        }

        /* FEEDBACK OVERLAY */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .fb-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .fb-msg {
            font-size: 1.2rem;
            font-weight: 800;
            text-align: center;
            padding: 0 20px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .fb-sub {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .damage-float {
            position: absolute;
            color: var(--neon-red);
            font-weight: 900;
            font-size: 2rem;
            animation: floatUp 0.8s forwards;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
        }

        /* ANIMATIONS */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-10px);
            }

            40% {
                transform: translateX(10px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }

        @keyframes lunge {
            0% {
                transform: translateX(0) scale(1);
            }

            50% {
                transform: translateX(50px) scale(1.2);
            }

            100% {
                transform: translateX(0) scale(1);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }

            50% {
                opacity: 1;
                transform: translateY(-30px) scale(1.2);
            }

            100% {
                transform: translateY(-60px) scale(1);
                opacity: 0;
            }
        }

        .end-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .btn-restart {
            background: var(--neon-gold);
            color: black;
            border: none;
            padding: 15px 40px;
            font-weight: 900;
            font-size: 1.2rem;
            border-radius: 30px;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <h1>Conjugation Kombat</h1>

    <!-- START SCREEN -->
    <div class="start-screen" id="start-screen">
        <h1 style="margin-bottom: 40px; font-size: 2.5rem">CHOOSE MODE</h1>

        <button class="mode-btn" onclick="selectMode('verb')">
            Conjugación <span>⚔️</span>
        </button>

        <button class="mode-btn" onclick="selectMode('nom')">
            Det. e Indet. <span>🔄</span>
        </button>

        <button class="mode-btn" onclick="selectMode('akk')">
            Acusativos <span>🎁</span>
        </button>

        <button class="mode-btn" style="border-color: var(--neon-gold)" onclick="selectMode('all')">
            MIX TOTAL <span>🔥</span>
        </button>
    </div>

    <div class="game-area">
        <!-- BARS -->
        <div class="bars">
            <div class="health-box">
                <div class="bar-label">
                    <span>TÚ (SERGIO)</span>
                    <span id="player-hp-text">100%</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill player-bar" id="player-bar"></div>
                </div>
            </div>
            <div class="health-box">
                <div class="bar-label">
                    <span id="enemy-hp-text">100%</span>
                    <span>ENEMIGO</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill enemy-bar" id="enemy-bar"></div>
                </div>
            </div>
        </div>

        <!-- ARENA -->
        <div class="arena" id="arena">
            <div class="avatar" id="avatar-player">🥷</div>
            <div class="avatar" id="avatar-enemy">👹</div>
        </div>

        <!-- CARD -->
        <div class="card" id="q-card">
            <div class="q-label" id="q-type">MISSION</div>
            <div class="q-text" id="q-text">Ready?</div>

            <div class="overlay" id="feedback-overlay">
                <div class="fb-icon" id="fb-icon"></div>
                <div class="fb-msg" id="fb-msg"></div>
                <div class="fb-sub" id="fb-sub"></div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="options-grid" id="options">
            <!-- Buttons injected here -->
        </div>
    </div>

    <!-- END SCREEN -->
    <div class="end-screen" id="end-screen">
        <h1 id="end-title" style="font-size: 3rem">VICTORY</h1>
        <div id="end-msg" style="font-size: 1.2rem; color: #94a3b8; text-align: center">...</div>
        <button class="btn-restart" onclick="location.reload()">Jugar de Nuevo</button>
    </div>

    <script>
        // --- WORD BANKS (Dynamic Question Generation) ---
        // Nouns from vocabulary game: [word, gender] where gender = 'm' (der), 'f' (die), 'n' (das)
        const nouns = [
            // TRANSPORTES - Masculino (der)
            ['Bus', 'm'], ['Zug', 'm'], ['Reisebus', 'm'], ['Lastwagen', 'm'], ['Hubschrauber', 'm'],
            // TRANSPORTES - Femenino (die)
            ['U-Bahn', 'f'], ['Straßenbahn', 'f'],
            // TRANSPORTES - Neutro (das)
            ['Fahrrad', 'n'], ['Moped', 'n'], ['Motorrad', 'n'], ['Taxi', 'n'], ['Auto', 'n'],
            ['Wohnmobil', 'n'], ['Flugzeug', 'n'], ['Schiff', 'n'], ['Boot', 'n'],

            // LUGARES - Masculino (der)
            ['Bahnhof', 'm'], ['Hafen', 'm'], ['Park', 'm'], ['Markt', 'm'], ['Marktplatz', 'm'],
            ['Sportplatz', 'm'], ['Spielplatz', 'm'], ['Supermarkt', 'm'], ['Zoo', 'm'],
            ['Fluss', 'm'], ['See', 'm'], ['Turm', 'm'],
            // LUGARES - Femenino (die)
            ['Kirche', 'f'], ['Bank', 'f'], ['Post', 'f'], ['Schule', 'f'], ['Bibliothek', 'f'],
            ['Apotheke', 'f'], ['Bushaltestelle', 'f'], ['Polizei', 'f'], ['Toilette', 'f'],
            ['Kunsthalle', 'f'], ['Brücke', 'f'],
            // LUGARES - Neutro (das)
            ['Rathaus', 'n'], ['Theater', 'n'], ['Museum', 'n'], ['Hotel', 'n'], ['Kino', 'n'],
            ['Café', 'n'], ['Krankenhaus', 'n'], ['Schwimmbad', 'n'], ['Konzerthaus', 'n'],

            // COMIDA - Masculino (der)
            ['Apfel', 'm'], ['Salat', 'm'], ['Käse', 'm'], ['Schinken', 'm'], ['Fisch', 'm'],
            ['Kuchen', 'm'], ['Reis', 'm'], ['Kaffee', 'm'], ['Tee', 'm'], ['Wein', 'm'],
            // COMIDA - Femenino (die)
            ['Banane', 'f'], ['Birne', 'f'], ['Orange', 'f'], ['Kartoffel', 'f'], ['Tomate', 'f'],
            ['Gurke', 'f'], ['Zwiebel', 'f'], ['Milch', 'f'], ['Butter', 'f'], ['Wurst', 'f'],
            ['Marmelade', 'f'], ['Suppe', 'f'], ['Pizza', 'f'], ['Torte', 'f'],
            // COMIDA - Neutro (das)
            ['Gemüse', 'n'], ['Ei', 'n'], ['Fleisch', 'n'], ['Hähnchen', 'n'], ['Brot', 'n'],
            ['Brötchen', 'n'], ['Salz', 'n'], ['Eis', 'n'], ['Wasser', 'n'], ['Bier', 'n']
        ];

        // Verbs for Accusative sentences
        const akkVerbs = [
            'Ich nehme', 'Ich möchte', 'Ich brauche', 'Ich suche', 'Ich kaufe',
            'Ich habe', 'Ich sehe', 'Wir kaufen', 'Er sucht', 'Sie braucht',
            'Ich esse', 'Ich trinke', 'Wir nehmen'
        ];

        // Get article info by gender
        function getArticleInfo(gender) {
            if (gender === 'm') return { def: 'der', defAkk: 'den', indef: 'ein', indefAkk: 'einen', cssClass: 'c-der' };
            if (gender === 'f') return { def: 'die', defAkk: 'die', indef: 'eine', indefAkk: 'eine', cssClass: 'c-die' };
            return { def: 'das', defAkk: 'das', indef: 'ein', indefAkk: 'ein', cssClass: 'c-das' };
        }

        // Generate a random NOM question
        function generateNomQuestion() {
            const [word, gender] = nouns[Math.floor(Math.random() * nouns.length)];
            const info = getArticleInfo(gender);
            return {
                type: 'nom',
                text: `Das ist <span class="${info.cssClass}">${info.def}</span> ${word}.`,
                q: `Das ist ... ${word}`,
                a: info.indef,
                opts: ['ein', 'eine', 'einen']
            };
        }

        // Generate a random AKK question
        function generateAkkQuestion() {
            const [word, gender] = nouns[Math.floor(Math.random() * nouns.length)];
            const verb = akkVerbs[Math.floor(Math.random() * akkVerbs.length)];
            const info = getArticleInfo(gender);
            return {
                type: 'akk',
                text: `${info.def.charAt(0).toUpperCase() + info.def.slice(1)} ${word}. ${verb} <span class="${info.cssClass}">${info.defAkk}</span> ${word}.`,
                q: `${verb} ... ${word}`,
                a: info.indefAkk,
                opts: ['ein', 'eine', 'einen']
            };
        }

        // --- STATIC CONJUGATION QUESTIONS ---
        const verbQuestions = [
            // CONJUGATION (Regular - machen)
            { type: 'verb', q: 'du + machen', a: 'machst', opts: ['mache', 'machen', 'machst', 'macht'] },
            { type: 'verb', q: 'ihr + machen', a: 'macht', opts: ['machst', 'macht', 'machen', 'mache'] },
            // (trinken)
            { type: 'verb', q: 'er/sie + trinken', a: 'trinkt', opts: ['trinkst', 'trinken', 'trinkt', 'trinke'] },
            { type: 'verb', q: 'du + trinken', a: 'trinkst', opts: ['trinkt', 'trinken', 'trinkst', 'trinke'] },
            // (Irregular - essen)
            { type: 'verb', q: 'du + essen', a: 'isst', opts: ['esst', 'essen', 'isst', 'esse'] },
            { type: 'verb', q: 'ihr + essen', a: 'esst', opts: ['isst', 'essen', 'esst', 'esse'] },
            { type: 'verb', q: 'er/sie + essen', a: 'isst', opts: ['essen', 'esst', 'isst', 'esse'] },
            // (fahren)
            { type: 'verb', q: 'du + fahren', a: 'fährst', opts: ['fahrt', 'fährst', 'fahrs', 'fahren'] },
            { type: 'verb', q: 'ihr + fahren', a: 'fahrt', opts: ['fährst', 'fahrt', 'fahren', 'fahre'] },
            { type: 'verb', q: 'er/sie + fahren', a: 'fährt', opts: ['fährst', 'fahrt', 'fährt', 'fahren'] },
            // (sehen)
            { type: 'verb', q: 'du + sehen', a: 'siehst', opts: ['seht', 'siehst', 'sehen', 'sehe'] },
            { type: 'verb', q: 'er/sie + sehen', a: 'sieht', opts: ['seht', 'sieht', 'sehen', 'siet'] },
            // (möchten)
            { type: 'verb', q: 'ich + möchten', a: 'möchte', opts: ['möchte', 'möchtet', 'möchst', 'möchten'] },
            { type: 'verb', q: 'du + möchten', a: 'möchtest', opts: ['möchte', 'möchtest', 'magst', 'möchtet'] },
            // (mögen)
            { type: 'verb', q: 'ich + mögen', a: 'mag', opts: ['mag', 'mage', 'möge', 'magst'] },
            { type: 'verb', q: 'du + mögen', a: 'magst', opts: ['magst', 'möchst', 'mag', 'mögt'] },
            { type: 'verb', q: 'ihr + mögen', a: 'mögt', opts: ['mögt', 'magt', 'mögen', 'mag'] },
            // (lesen)
            { type: 'verb', q: 'du + lesen', a: 'liest', opts: ['lest', 'liest', 'lesen', 'lese'] },
            { type: 'verb', q: 'ihr + lesen', a: 'lest', opts: ['liest', 'lest', 'lesen', 'lese'] },
            // (sprechen)
            { type: 'verb', q: 'du + sprechen', a: 'sprichst', opts: ['sprecht', 'sprichst', 'sprechen', 'spreche'] },
            { type: 'verb', q: 'er/sie + sprechen', a: 'spricht', opts: ['sprecht', 'spricht', 'sprechen', 'sprichst'] },
            // (sein & haben)
            { type: 'verb', q: 'du + sein', a: 'bist', opts: ['bin', 'bist', 'ist', 'sind'] },
            { type: 'verb', q: 'ihr + sein', a: 'seid', opts: ['bist', 'sind', 'seid', 'ist'] },
            { type: 'verb', q: 'du + haben', a: 'hast', opts: ['habe', 'habt', 'hast', 'hat'] },
            { type: 'verb', q: 'ihr + haben', a: 'habt', opts: ['haben', 'hast', 'habt', 'hat'] },
        ];

        // STATE
        let state = {
            playerHP: 100,
            enemyHP: 100,
            currentQ: null,
            mode: 'all' // verb, nom, akk, all
        };

        const els = {
            pBar: document.getElementById('player-bar'),
            eBar: document.getElementById('enemy-bar'),
            pHp: document.getElementById('player-hp-text'),
            eHp: document.getElementById('enemy-hp-text'),
            pAva: document.getElementById('avatar-player'),
            eAva: document.getElementById('avatar-enemy'),
            qType: document.getElementById('q-type'),
            qText: document.getElementById('q-text'),
            opts: document.getElementById('options'),
            overlay: document.getElementById('feedback-overlay'),
            fbIcon: document.getElementById('fb-icon'),
            fbMsg: document.getElementById('fb-msg'),
            fbSub: document.getElementById('fb-sub'),
            arena: document.getElementById('arena'),
            startScreen: document.getElementById('start-screen')
        };

        function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

        function selectMode(kamode) {
            state.mode = kamode;
            document.getElementById('start-screen').style.display = 'none';
            startGame();
        }

        function startGame() {
            state.playerHP = 100;
            state.enemyHP = 100;
            updateBars();
            loadQuestion();
        }

        function loadQuestion() {
            if (state.playerHP <= 0 || state.enemyHP <= 0) return;

            els.overlay.classList.remove('visible');

            // Generate question based on mode
            let q;
            if (state.mode === 'verb') {
                // Use static verb questions
                q = verbQuestions[Math.floor(Math.random() * verbQuestions.length)];
            } else if (state.mode === 'nom') {
                // Generate dynamic nominative question
                q = generateNomQuestion();
            } else if (state.mode === 'akk') {
                // Generate dynamic accusative question
                q = generateAkkQuestion();
            } else {
                // MIX mode - random type
                const rand = Math.random();
                if (rand < 0.33) {
                    q = verbQuestions[Math.floor(Math.random() * verbQuestions.length)];
                } else if (rand < 0.66) {
                    q = generateNomQuestion();
                } else {
                    q = generateAkkQuestion();
                }
            }

            state.currentQ = q;

            let label = 'MISSION';
            if (q.type === 'verb') label = '🎯 CONJUGATION';
            if (q.type === 'nom') label = '🔄 ARTICLES (NOM)';
            if (q.type === 'akk') label = '⚡ ACCUSATIVE';

            els.qType.textContent = label;

            if (q.type === 'verb') {
                els.qText.innerHTML = q.q;
            } else {
                els.qText.innerHTML = `<div style="font-size:1rem; color:#94a3b8; margin-bottom:10px">${q.text}</div>${q.q.replace('...', '<span class="missing">?</span>')}`;
            }

            els.opts.innerHTML = '';
            // Add class based on number of options for better styling
            els.opts.className = 'options-grid' + (q.opts.length === 3 ? ' three-opts' : '');
            shuffle([...q.opts]).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-opt';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(opt);
                els.opts.appendChild(btn);
            });
        }

        function handleAnswer(ans) {
            const isCorrect = ans === state.currentQ.a;

            if (isCorrect) {
                // Success
                state.enemyHP -= 15;
                if (state.enemyHP < 0) state.enemyHP = 0;
                animAttack(true);
                showDamage(false, 15);
                showFeedback(true);
            } else {
                // Fail
                state.playerHP -= 20;
                if (state.playerHP < 0) state.playerHP = 0;
                animAttack(false);
                showDamage(true, 20);
                showFeedback(false);
            }

            updateBars();
            checkEnd();
        }

        function updateBars() {
            els.pBar.style.width = `${state.playerHP}%`;
            els.eBar.style.width = `${state.enemyHP}%`;
            els.pHp.textContent = `${state.playerHP}%`;
            els.eHp.textContent = `${state.enemyHP}%`;
        }

        function animAttack(playerAttacks) {
            const attacker = playerAttacks ? els.pAva : els.eAva;
            const victim = playerAttacks ? els.eAva : els.pAva;

            // Lunge
            attacker.style.transform = playerAttacks ? 'translateX(50px) scale(1.2)' : 'translateX(-50px) scale(1.2)';
            setTimeout(() => { attacker.style.transform = 'translate(0)'; }, 300);

            // Hit
            setTimeout(() => {
                victim.classList.add('hit');
                // Shake arena on fail
                if (!playerAttacks) els.qText.parentElement.classList.add('shake');
            }, 150);

            setTimeout(() => {
                victim.classList.remove('hit');
                els.qText.parentElement.classList.remove('shake');
            }, 600);
        }

        function showDamage(onPlayer, amount) {
            const el = document.createElement('div');
            el.className = 'damage-float';
            el.textContent = `-${amount}`;
            el.style.left = onPlayer ? '20px' : 'auto';
            el.style.right = onPlayer ? 'auto' : '20px';
            el.style.top = '20%';
            els.arena.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function showFeedback(isCorrect) {
            setTimeout(() => {
                if (state.playerHP <= 0 || state.enemyHP <= 0) return; // Don't show feedback if game over

                els.overlay.classList.add('visible');
                els.fbIcon.textContent = isCorrect ? '⚔️' : '🩸';

                // STANDARD MESSAGES (No more trolls)
                if (isCorrect) {
                    els.fbMsg.textContent = "¡CORRECTO!";
                    els.fbMsg.style.color = '#22c55e';
                    els.fbSub.textContent = "Sigue así";
                } else {
                    els.fbMsg.textContent = "INCORRECTO";
                    els.fbMsg.style.color = '#ef4444';
                    els.fbSub.innerHTML = `Solución: <b style="color:white; text-transform:uppercase">${state.currentQ.a}</b>`;
                }

                setTimeout(() => loadQuestion(), 1500);
            }, 600);
        }

        function checkEnd() {
            if (state.playerHP <= 0 || state.enemyHP <= 0) {
                setTimeout(() => {
                    document.getElementById('end-screen').style.display = 'flex';
                    const title = document.getElementById('end-title');
                    const msg = document.getElementById('end-msg');

                    if (state.playerHP > 0) {
                        title.textContent = "VICTORY";
                        title.style.color = 'var(--neon-gold)';
                        msg.textContent = "El monstruo gramatical ha sido derrotado... por ahora.";
                    } else {
                        title.textContent = "WASTED";
                        title.style.color = 'var(--neon-red)';
                        msg.textContent = "La gramática alemana te ha pasado por encima.";
                    }
                }, 1000);
            }
        }

        startGame();
    </script>
</body>

</html>
